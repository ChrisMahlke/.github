# Reusable CI for the iOS apps. Each app's own .github/workflows/ci.yml calls
# this with `uses: ChrisMahlke/.github/.github/workflows/ios-ci.yml@main`, so
# the runner, Xcode version and steps are decided once, here.
#
# The job runs the app's scripts/test.sh, the same script you run locally, so
# CI and your Mac test the same thing. On failure the .xcresult bundle is kept
# as an artifact for a week.
#
# Cost: GitHub bills macOS minutes at 10x Linux. Callers trigger only on
# pushes to main and pull requests, cancel superseded runs, and the job is
# capped at 30 minutes.
name: iOS CI

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image label (xcode-27 matches the Xcode the apps ship from)
        type: string
        default: xcode-27
      xcode:
        description: Xcode app bundle to select on the runner
        type: string
        default: /Applications/Xcode_27.app
      timeout-minutes:
        type: number
        default: 30

jobs:
  test:
    name: Build and test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "${{ inputs.xcode }}"
          xcodebuild -version

      - name: Build and run the tests
        env:
          RESULT_BUNDLE: ${{ runner.temp }}/tests.xcresult
        run: ./scripts/test.sh

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests.xcresult
          path: ${{ runner.temp }}/tests.xcresult
          retention-days: 7
          if-no-files-found: ignore
